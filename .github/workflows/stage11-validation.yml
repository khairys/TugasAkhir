name: Stage 11 artifact validation

on:
  push:
    branches:
      - stage11-robustness-analysis
  pull_request:
    branches:
      - stage11-robustness-analysis
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-stage11:
    name: Regenerate and validate frozen Stage 11 outputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependencies
        run: python -m pip install --upgrade pip pytest numpy pandas scikit-learn
      - name: Regenerate primary analysis from committed Stage 10 predictions
        run: python scripts/analysis/stage11_robustness_analysis.py --bootstrap-resamples 10000 --seed 42 --max-error-samples 3
      - name: Validate frozen Stage 11 artifacts
        run: python scripts/validation/validate_stage11_artifacts.py
      - name: Run Stage 11 unit tests
        run: python -m pytest -q tests/stage11
      - name: Commit refreshed derived primary reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/stage11/primary/*.csv reports/stage11/primary/analysis_snapshot_manifest.json
          if git diff --cached --quiet; then
            echo "Derived Stage 11 primary reports already match committed inputs."
          else
            git commit -m "chore(stage11): refresh derived primary reports from committed predictions"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
